[package]
name = "writ-approval-server"
version = "0.1.0"
description = "Writ V2 production entry point of the local approval channel: writ-approval-server (M4 Y3, D-043)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Reviewed allow-list: approval-server/deps-allowlist.json. This crate, not writ-approval, links
# the SQLite ledger. Tokio `signal` (with `rt` for the signal thread's current-thread runtime)
# for the J-8 bounded graceful shutdown (D-045 M5-D16; M5-DEPENDENCY-REVIEW section 2): adds
# the package signal-hook-registry 1.4.8. writ-approval's source never uses `tokio::signal`
# (source scan in kernel/tools/check_deps.py).
[dependencies]
writ-approval = { path = "../approval" }
writ-broker = { path = "../broker" }
writ-ledger-sqlite = { path = "../persistence/sqlite" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "signal"] }

[[bin]]
name = "writ-approval-server"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

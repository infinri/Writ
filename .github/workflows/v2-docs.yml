name: V2 documentation and contract integrity
on:
  push:
    branches:
      - 'v2/**'
  pull_request:
    branches:
      - 'v2/**'
jobs:
  docs-v2:
    name: V2 documentation and schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check -r requirements-v2-docs.txt
      - name: Check docs, HTML, schemas, packs and task fixtures
        run: python3 scripts/check-v2-docs.py
  m0-harness:
    name: M0 reference harness and audit drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The audit reads V1 from pinned main commit ebdafe5 through git objects.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M0 dependencies
        run: python -m pip install --disable-pip-version-check -r m0/requirements.txt
      - name: Run M0 tests
        working-directory: m0
        run: python -m pytest
      - name: Check generated audit evidence is current
        working-directory: m0
        run: python -m writ_m0.audit check
      - name: M1 parity driver self-tests and fixture drift
        env:
          WRIT_M0_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: python -m unittest discover -s m1/driver/tests -v
  m1-rust:
    name: M1 Rust prototype parity (functional, no benchmarks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Build and test
        working-directory: m1/rust
        run: |
          cargo +1.99.1 build --release --locked
          cargo +1.99.1 test --release --locked
      - name: Parity driver, all fixture sets
        run: python3 m1/driver/parity.py --proto "$GITHUB_WORKSPACE/m1/rust/target/release/proto" --manifest m1/fixtures/manifest.json --repeat 2
  m1-go:
    name: M1 Go prototype parity (functional, no benchmarks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Vet, build and race tests
        working-directory: m1/go
        env:
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go build -o proto ./cmd/proto
          go test -race -count=1 ./...
      - name: Parity driver, all fixture sets
        run: python3 m1/driver/parity.py --proto "$GITHUB_WORKSPACE/m1/go/proto" --manifest m1/fixtures/manifest.json --repeat 2
  m1-props:
    name: M1 property and differential tests (required; seeded CI profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Build both prototypes independently
        env:
          GOTOOLCHAIN: local
        run: |
          (cd m1/rust && cargo +1.99.1 build --release --locked)
          (cd m1/go && go build -o proto ./cmd/proto)
      - name: Property-found regression cases
        run: |
          python3 m1/driver/parity.py --proto "$GITHUB_WORKSPACE/m1/rust/target/release/proto" --manifest m1/props/regressions/manifest.json
          python3 m1/driver/parity.py --proto "$GITHUB_WORKSPACE/m1/go/proto" --manifest m1/props/regressions/manifest.json
      - name: Seeded property, invariant and differential campaigns (seeds 20261107 and 1)
        run: |
          set -o pipefail
          for seed in 20261107 1; do
            python3 m1/props/run.py --profile ci --seed "$seed" --rust "$GITHUB_WORKSPACE/m1/rust/target/release/proto" --go "$GITHUB_WORKSPACE/m1/go/proto" --out "props-ci-$seed.json"
          done
      - name: Mutation smoke test (every deliberate mutant must be caught)
        run: |
          python3 m1/props/mutants/smoke.py --real "$GITHUB_WORKSPACE/m1/rust/target/release/proto" --seed 7 --cases 300 --out props-smoke-rust.json
          python3 m1/props/mutants/smoke.py --real "$GITHUB_WORKSPACE/m1/go/proto" --seed 7 --cases 300 --out props-smoke-go.json
      - name: Upload property reports (reproduction evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-props-reports
          path: |
            props-ci-*.json
            props-smoke-*.json
          if-no-files-found: warn

[package]
name = "writ-kernel"
version = "0.1.0"
description = "Writ V2 trusted kernel: deterministic, key-free policy decisions and workflow transitions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# Runtime dependencies: reviewed allow-list only (kernel/DEPENDENCIES.md). The kernel is key-free:
# no MAC, signature or key material crates.
[dependencies]
sha2 = { version = "=0.10.8", default-features = false }

# Development-only dependencies: none yet (tests use the standard library and repository fixtures).
[dev-dependencies]

[lints]
workspace = true

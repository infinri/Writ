[package]
name = "writ-policy-management-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Disposable policy management for M6"

[workspace]

[features]
fixtures = ["dep:ed25519-dalek", "writ-broker/disposable-waiver-fixture-ingress"]

[[bin]]
name = "writ-manage-fixture"
path = "src/main.rs"
required-features = ["fixtures"]

[[bin]]
name = "writ-publication-authority-fixture"
path = "src/fixture_authority.rs"
required-features = ["fixtures"]

[[bin]]
name = "writ-evaluator-authority-fixture"
path = "src/evaluator_fixture_authority.rs"
required-features = ["fixtures"]

[[bin]]
name = "writ-waiver-authority-fixture"
path = "src/waiver_fixture_authority.rs"
required-features = ["fixtures"]

[[bin]]
name = "writ-contract-authority-fixture"
path = "src/contract_fixture_authority.rs"
required-features = ["fixtures"]

[dependencies]
writ-kernel = { path = "../../kernel" }
writ-policy-compile = { path = "../compiler" }
writ-policy-publication-lab = { path = "../publication" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"], optional = true }
writ-broker = { path = "../../broker" }
writ-ledger-sqlite = { path = "../../persistence/sqlite" }
rusqlite = { version = "=0.41.1", default-features = false, features = ["hooks", "limits"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

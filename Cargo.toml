# Writ V2 Rust workspace (ADR-0002 ACCEPTED, D-030).
# Includes the development-only MCP shim. The M0 reference harness and the M1
# bake-off prototypes stay outside the workspace.
[workspace]
resolver = "2"
members = ["kernel", "broker", "persistence/sqlite", "approval", "approval-server", "keys", "hostsys", "rpc", "service", "containment", "fs-effects", "m5/mcp-shim"]
exclude = ["m0", "m1"]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
debug = false

# The job launcher and its helper are built with `panic = "abort"` (J-11.1: no unwinding runs a
# destructor, such as a gate-writer close, on a panic path): `cargo build --locked --profile
# launcher -p writ-containment`. Both binaries refuse to run when built with another strategy.
[profile.launcher]
inherits = "release"
panic = "abort"

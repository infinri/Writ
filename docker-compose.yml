name: writ

services:
  neo4j:
    image: neo4j:5
    container_name: writ-neo4j
    restart: unless-stopped
    ports:
      # Loopback only. Published on every interface, the graph answered on every network this
      # machine joined. An existing container keeps the bindings it was created with, so re-create
      # it after changing these lines (docs/install.md, "Securing an existing install").
      - "127.0.0.1:7474:7474"  # HTTP browser
      - "127.0.0.1:7687:7687"  # Bolt (used by the Writ server)
    environment:
      # Never written here. Pass it inline, scoped to the one command:
      #   WRIT_NEO4J_PASSWORD="$(writ neo4j password)" docker compose -f ... up -d neo4j
      # Unset, the development default seeds a BRAND-NEW volume only (Neo4j ignores NEO4J_AUTH
      # for a database that already exists). Writ refuses that password until
      # `writ neo4j set-password` replaces it, and the loopback ports keep it off the network.
      NEO4J_AUTH: neo4j/${WRIT_NEO4J_PASSWORD:-writdevpass}
      NEO4J_PLUGINS: "[]"
    volumes:
      - writ-neo4j-data:/data
    healthcheck:
      # Interpolated when the container is created, like NEO4J_AUTH, so the container is
      # re-created with the variable set after every password change.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${WRIT_NEO4J_PASSWORD:-writdevpass}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  writ-neo4j-data:
    name: writ-neo4j-data
